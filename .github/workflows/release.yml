name: release

# Builds the herdr-bar binary for every platform the plugin supports and
# attaches them to the GitHub release for the tag.
#
# Asset names are a contract with the downloader, do not change them:
#   herdr-bar-<os>-<arch>[.exe]   os in {linux, macos, windows},
#                                 arch in {x86_64, aarch64}
#   SHA256SUMS                    "<sha256>  <asset name>" per binary

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.9.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl targets link statically with Rust's bundled musl; the only
          # dependency is the libc crate, so no C toolchain for musl is needed.
          # Each one builds natively on a runner of its own architecture.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            asset: herdr-bar-linux-x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: herdr-bar-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: herdr-bar-macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: herdr-bar-macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: herdr-bar-windows-x86_64.exe
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            asset: herdr-bar-windows-aarch64.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/herdr-bar${suffix}" "dist/${{ matrix.asset }}"
          ls -l dist
      - name: Check static linkage
        if: contains(matrix.target, 'linux-musl')
        run: |
          file "dist/${{ matrix.asset }}"
          file "dist/${{ matrix.asset }}" | grep -Eq 'statically linked|static-pie linked'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          expected="herdr-bar-linux-x86_64 herdr-bar-linux-aarch64 herdr-bar-macos-x86_64 herdr-bar-macos-aarch64 herdr-bar-windows-x86_64.exe herdr-bar-windows-aarch64.exe"
          for name in $expected; do
            test -f "$name" || { echo "missing $name"; exit 1; }
          done
          sha256sum $expected > SHA256SUMS
          cat SHA256SUMS
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
