name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          # setup-python has no macOS arm64 build below 3.11, and macos-latest
          # is arm64. The 3.9 floor is covered on Linux.
          - os: macos-latest
            python: "3.9"
          # Windows has its own console and pipe code paths; one interpreter
          # covers them, and the 3.9 floor is covered on Linux.
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -t .
        env:
          PYTHONPATH: src
      - name: Static frame renders
        run: python scripts/demo.py --frame --plain --size 100x18
      # The paint metrics are byte-identical on every version and platform we
      # build for, so this is a real gate rather than a weather report.
      - name: Render score
        run: python scripts/bench.py --check
        env:
          PYTHONPATH: src
      - name: Manifest parses
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python - <<'PY'
          import tomllib
          with open("herdr-plugin.toml", "rb") as handle:
              manifest = tomllib.load(handle)
          for key in ("id", "name", "version", "min_herdr_version"):
              assert manifest.get(key), "manifest is missing %s" % key
          assert manifest["panes"][0]["placement"] == "popup"
          assert manifest["actions"][0]["id"] == "open"
          print("manifest ok:", manifest["id"], manifest["version"])
          PY

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      # Pinned: an unpinned linter can fail a green tree on someone else's release.
      - run: pip install ruff==0.16.0
      - run: ruff check .

  rust:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # No `cargo fmt --check` yet: the port is not rustfmt-clean, and
      # reformatting it is a separate change from wiring up CI.
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked

  # Cargo.toml's rust-version: the oldest toolchain a source install
  # (scripts/install.sh's cargo fallback) is promised to work with.
  msrv:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked

  # The Rust build has to be a drop-in replacement for the Python one: the
  # parity harness drives both on a pty against a fake Herdr and fails on any
  # difference, and the fuzzer checks the pure functions input by input.
  parity:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --release --locked
      - name: Python vs Rust transcripts
        run: python3 scripts/parity.py --rust target/release/herdr-bar
      - name: Build probe
        run: cargo build --release --locked --features probe
      - name: Differential fuzz
        run: python3 scripts/fuzz_parity.py --probe target/release/herdr-bar --count 2000
